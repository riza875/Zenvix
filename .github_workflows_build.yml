name: Build APK
on: workflow_dispatch

env:
  # ID aplikasi AdMob. Ganti dengan App ID asli (format ca-app-pub-XXXX~YYYY). Ini ID tes dari Google.
  ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Prepare web folder
        run: mkdir -p www && cp index.html manifest.json sw.js icon-192.png icon-512.png maskable-512.png www/
      - name: Add Android
        run: npx cap add android
      - name: Launcher icons
        run: pip install pillow && python3 make_icons.py
      - name: Sync web assets
        run: npx cap sync android
      - name: google-services.json
        run: cp google-services.json android/app/google-services.json
      - name: Patch AdMob App ID
        run: python3 patch_manifest.py "$ADMOB_APP_ID"
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > cato.keystore
      - name: Build release
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Align and sign
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p 4 "$IN" aligned.apk
          $BT/apksigner sign --ks cato.keystore --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias cato --out CATO.apk aligned.apk
          $BT/apksigner verify CATO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CATO-apk
          path: CATO.apk
